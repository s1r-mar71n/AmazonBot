# Copy to config.toml and edit. The watcher re-reads this file every round,
# so you can add/remove products without restarting the service.

# Alerts go to every channel configured here: ntfy, Telegram, or both.
[ntfy]
server = "https://ntfy.sh"          # or your self-hosted ntfy
topic  = "change-me-to-something-unguessable"
# token = "tk_..."                  # only if your topic requires auth

# [telegram]
# bot_token = "123456:ABC..."       # from @BotFather; the bot must be able to post to chat_id
# chat_id   = "-100..."             # a channel/group id, or your own user id

[settings]
interval_minutes = 20               # one round = one request per product
jitter_minutes   = 5                # +/- randomisation of the interval
delay_between_products_seconds = [20, 60]
renotify_hours   = 12               # repeat an alert if the deal is still there (sooner if price drops further)
# accept_language = "de-DE,de;q=0.9,en;q=0.8"
# warehouse_sellers    = ["amazon warehouse", "amazon resale", "warehouse deals", "amazon retourenkauf"]
# warehouse_seller_ids = ["A8KICS1PHF7ZO"]
# state_file = "state.json"
apple_interval_minutes = 10        # Apple refurbished pages (one request per distinct URL)

# ---------------------------------------------------------------- Amazon
# One block per product. Short links (amzn.eu/d/...) and full links both work.
# Set max_new, max_warehouse or both; leave one out to ignore that kind of offer.

[[product]]
url = "https://amzn.eu/d/01xSbc0F"
name = "Example product"            # optional; otherwise the Amazon title is used
max_new = 300
max_warehouse = 250

# [[product]]
# url = "https://www.amazon.de/dp/B0XXXXXXXX"
# max_warehouse = 120

# ---------------------------------------------------------------- Amazon over proxies
# Products with proxy = true are checked through a proxy pool instead of the home IP: one
# offer-list request at a time, each proxy at most every per_proxy_interval_minutes. The first
# refusal (CAPTCHA, WAF/Akamai challenge, any non-200, anything that isn't an offer list) halts
# that proxy and alerts you. `urls` lists several products that share the limits.

# [proxies]
# rayobyte_secret = "/home/martin/priceapi/skinbaron-secret.yml"  # reads rayobyte: email + api-key
# list_file = "proxies.txt"         # or a file of ip:port:user:pass lines
# per_proxy_interval_minutes = 10   # min 3; the pool sends one request every interval / proxies
# halt_hours = 24                   # a refused proxy rests this long; doubles on a repeat within a week (max 7 days)
# breaker_halts = 3                 # this many refusals within breaker_window_hours ...
# breaker_window_hours = 6
# breaker_pause_hours = 12          # ... pause the whole pool this long

# [[product]]
# urls = ["https://www.amazon.de/dp/B0DSQ1RCZV", "https://www.amazon.de/dp/B0DS65VMC6"]
# max_warehouse = 1400
# proxy = true                      # needs full /dp/<ASIN> links

# ---------------------------------------------------------------- Apple refurbished
# Alerts once per new listing whose title contains ALL `match` words (case-insensitive)
# and NONE of the `exclude` words. A listing alerts again if its price drops, or if it
# disappears and comes back.
# Important: when a category is sold out, Apple shows the whole parent category
# (e.g. all Macs) on that URL, so `match` is what keeps you from getting spammed.

[[apple]]
url = "https://www.apple.com/de/shop/refurbished/mac/mac-studio"
match = ["Mac Studio"]
# exclude = ["M2"]
# max_price = 2500

[[apple]]
url = "https://www.apple.com/de/shop/refurbished/mac/mac-mini"
match = ["Mac mini"]

# ---------------------------------------------------------------- Shopify stores (e.g. MSI)
# Alerts once when a matching product variant is in stock (again after it sold out, or if its
# price drops). `url` is a /collections/... page or the store root (whole catalogue).
# `types` filters on Shopify's product_type ("VGA" = graphics cards at MSI), which keeps
# laptops with an "RTX 5090 Laptop GPU" out. Collections hide sold-out products, and a card
# could be listed outside them (refurbished/outlet), so a slower store-wide scan is a good backstop.
# shop_interval_minutes in [settings] is the default (5); minimum 1.
# sold_out_alerts = true adds a quiet (silent) alert for new listings that are already sold out;
# only a store-root entry can see those, as collections hide sold-out products.

[[shop]]
url = "https://de-store.msi.com/collections/geforce-rtx-5090-series-gpu"
match = ["5090"]
types = ["VGA"]
interval_minutes = 1                # tiny feed: cheap to poll

[[shop]]
url = "https://de-store.msi.com"    # whole store: ~4 requests, ~4 MB
match = ["5090"]
types = ["VGA"]
interval_minutes = 10
sold_out_alerts = true              # quiet alert when a new 5090 is listed already sold out
